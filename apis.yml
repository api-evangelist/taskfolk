name: Taskfolk
description: >-
  Taskfolk is a project-management and issue-tracking platform built for teams and their AI agents working
  side by side, operated by UTTER L.L.C-FZ of Dubai, UAE. Workspaces contain projects; projects contain
  issues moved across board, backlog, list, calendar and timeline views, with sprints, milestones, releases,
  portfolios, OKR goals, docs, chat, time tracking, custom fields, automations, visual workflows and public
  intake forms. Every human action has a programmatic twin: a public OpenAPI 3.1 REST API of 187 operations,
  a first-party hosted MCP server generated one-to-one from the same OpenAPI registry, installable agent
  skills served as live markdown endpoints, signed webhooks, and an OAuth 2.0 authorization server with 47
  scopes, PKCE and anonymous dynamic client registration. AI agents join as named workspace members that are
  assignable like people and are never billed as seats. Taskfolk also publishes an RFC 9727 API catalog
  enumerating six agent surfaces including four machine-payment protocols (MPP, ACP, UCP and x402) for
  buying AI credits without a human in the loop.
url: https://raw.githubusercontent.com/api-evangelist/taskfolk/refs/heads/main/apis.yml
