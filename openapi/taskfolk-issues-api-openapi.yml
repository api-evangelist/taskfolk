          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Issue:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
          example: WEB-39
        url:
          type: string
          example: https://taskfolk.ai/w/taskfolk/p/web/WEB-39
        number:
          type: integer
        type:
          type: string
          enum:
          - epic
          - story
          - task
          - bug
          - subtask
        title:
          type: string
        description_md:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - backlog
          - todo
          - in_progress
          - in_review
          - done
          - failed
          - cancelled
        status_id:
          type:
          - string
          - 'null'
          description: Specific board status id (project_statuses). See GET .../statuses.
        status_name:
          type:
          - string
          - 'null'
          description: Display name of the board status.
        priority:
          type: string
          enum:
          - lowest
          - low
          - medium
