          type: string
          example: 019e6f12-…
        required: true
        name: id
        in: path
      - schema:
          type: string
          enum:
          - md
          - html
          - pdf
        required: false
        name: format
        in: query
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
