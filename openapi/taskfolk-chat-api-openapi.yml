                required:
                - data
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing / invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Key lacks the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource not found (or cross-workspace — never leaked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Pagination:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          example: null
      required:
      - next_cursor
    ChatChannelCreateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum:
          - public
          - private
          description: Defaults to public. DMs cannot be created over the API.
        topic:
          type: string
          maxLength: 280
      required:
      - name
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        channel_id:
          type: string
        author_id:
          type: string
        body_md:
          type: string
        parent_id:
          type:
          - string
          - 'null'
          description: The message this one replies to (may itself be a reply); null when top-level.
        root_id:
          type:
          - string
          - 'null'
          description: Thread root message id; null for a top-level message.
        reply_count:
          type: integer
        last_reply_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-05-28T14:30:00Z'
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-05-28T14:30:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-05-28T14:30:00Z'
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji:
                type: string
              count:
                type: integer
              user_ids:
                type: array
                items:
                  type: string
            required:
            - emoji
            - count
            - user_ids
      required:
      - id
      - channel_id
      - author_id
      - body_md
      - parent_id
      - root_id
      - reply_count
      - last_reply_at
      - edited_at
      - created_at
      - reactions
    ChatChannelMember:
      type: object
      properties:
        user_id:
          type: string
        role:
          type: string
          enum:
          - owner
          - member
        joined_at:
          type: string
          format: date-time
          example: '2026-05-28T14:30:00Z'
      required:
      - user_id
      - role
      - joined_at
    ChatMessageCreateInput:
      type: object
      properties:
        body_md:
          type: string
          minLength: 1
          maxLength: 64000
        parent_id:
          type: string
          description: Reply to this message — the thread root or any reply within it (nested replies are supported).
      required:
      - body_md
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - not_found
              - validation
              - rate_limited
              - conflict
              - idempotency_violation
              - internal_error
              example: validation
            message:
              type: string
              example: Label "foo" does not exist on this project.
            details:
              type: object
              additionalProperties: {}
          required:
          - code
          - message
      required:
      - error
    ChatChannelPatchInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        topic:
          type:
          - string
          - 'null'
          maxLength: 280
        archived:
          type: boolean
    ChatReactions:
      type: object
      properties:
        message_id:
          type: string
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji:
                type: string
              count:
                type: integer
              user_ids:
                type: array
                items:
                  type: string
            required:
            - emoji
            - count
            - user_ids
      required:
      - message_id
      - reactions
    ChatChannel:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - public
          - private
          - dm
        name:
          type:
          - string
          - 'null'
          description: Null for DM channels.
        slug:
          type:
          - string
          - 'null'
        topic:
          type:
          - string
          - 'null'
        created_by:
          type: string
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-05-28T14:30:00Z'
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-05-28T14:30:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-05-28T14:30:00Z'
        member_count:
          type: integer
        is_member:
          type: boolean
      required:
      - id
      - kind
      - name
      - slug
      - topic
      - created_by
      - archived_at
      - last_message_at
      - created_at
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Workspace API key. Send as `Authorization: Bearer tfk_live_…`. Each key is bound to exactly one workspace and carries a set of scopes.'
