  /v1/workspaces/{slug}/chat/channels/{channelId}/messages/stream:
    post:
      summary: 'Stream a message live (AGENT-COLLAB-01): omit message_id to open, then append deltas, then send done:true to finalize. Members watch it grow in real time.'
      tags:
      - Chat
      security:
      - bearerAuth:
        - chat:write
      parameters:
      - schema:
          type: string
          example: taskfolk
          description: Workspace slug.
        required: true
        description: Workspace slug.
        name: slug
        in: path
      - schema:
          type: string
          example: 019e6f12-…
          description: Chat channel id.
        required: true
        description: Chat channel id.
        name: channelId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                delta:
                  type: string
                  maxLength: 16000
                done:
                  type: boolean
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message_id:
                        type: string
                      done:
                        type: boolean
                    required:
